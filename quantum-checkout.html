<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum Pro — Abbonamento</title>
<style>
  :root{ --gold:#a3822f; --gold-dark:#7a611f; --ink:#111; --gray:#6b6459; --border:#e2d9c4; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Arial,sans-serif;background:#faf7f0;color:var(--ink);}
  header{background:#111;padding:32px 18px;text-align:center;color:#f0e3c8;}
  header .brand{font-family:Georgia,serif;font-weight:400;letter-spacing:3px;font-size:22px;color:var(--gold);}
  header p{font-size:13px;color:#cfc3a0;margin-top:8px;}
  .wrap{max-width:460px;margin:0 auto;padding:30px 16px 60px;}
  .plan{background:#fff;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.06);border:2px solid var(--gold);padding:28px 24px;text-align:center;}
  .plan h2{font-family:Georgia,serif;font-size:20px;margin:0 0 6px;}
  .plan .price{font-size:36px;font-weight:700;color:var(--gold-dark);font-family:Georgia,serif;margin:10px 0 2px;}
  .plan .price span{font-size:13px;color:var(--gray);font-weight:400;}
  .plan ul{text-align:left;font-size:14px;color:#333;padding-left:20px;margin:20px 0;}
  .plan li{margin-bottom:8px;}
  .plan button{width:100%;padding:14px;border:none;border-radius:9px;background:var(--gold);color:#fff;font-size:14px;font-weight:700;letter-spacing:.5px;cursor:pointer;margin-top:10px;}
  .plan button:disabled{opacity:.6;}
  .plan .fineprint{font-size:11px;color:var(--gray);margin-top:12px;}
  .billing-toggle{display:flex;gap:10px;margin:16px 0;}
  .billing-option{flex:1;border:1px solid var(--border);border-radius:8px;padding:10px 8px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .billing-option:has(input:checked){border-color:var(--gold);background:#faf5e8;font-weight:700;}
  .save-badge{font-size:10px;background:var(--gold);color:#fff;padding:2px 6px;border-radius:10px;margin-left:auto;}
  .msg{font-size:13px;margin-top:16px;padding:10px;border-radius:8px;display:none;}
  .msg.err{background:#fbe4e4;color:#a33;display:block;}
  #loadingMsg{text-align:center;padding:60px 16px;color:var(--gray);}
</style>
</head>
<body>

<header>
  <div class="brand">QUANTUM</div>
  <p>Passa a Pro</p>
</header>

<div class="wrap">
  <div id="loadingMsg">Caricamento…</div>
  <div id="planBlock" style="display:none;"></div>
  <div id="msg" class="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://znjycwnwkjrzgwvxhojp.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_gTcYFucCifjDUfuvhBhgwg_FSldicss";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showMsg(text){
    const el = document.getElementById('msg');
    el.textContent = text; el.className = 'msg err';
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function fmtEuro(n){ return Number(n).toLocaleString('it-IT', { minimumFractionDigits: n % 1 ? 2 : 0 }) + '€'; }

  // Prezzi caricati da quantum_pricing (modificabile dall'admin, mai hardcoded qui).
  // Il prezzo VERO addebitato lo ricalcola comunque quantum-create-checkout lato server —
  // questo serve solo a mostrare le card correttamente, stesso schema di folium-checkout.html.
  async function renderPlan(){
    const { data: priceRows, error } = await sb
      .from('quantum_pricing')
      .select('key, price, currency')
      .eq('category', 'subscription')
      .eq('active', true);

    document.getElementById('loadingMsg').style.display = 'none';

    var monthly = priceRows && priceRows.find(function(r){ return r.key === 'pro_monthly'; });
    var annual = priceRows && priceRows.find(function(r){ return r.key === 'pro_annual'; });

    if(error || !monthly){
      document.getElementById('planBlock').style.display = 'block';
      document.getElementById('planBlock').innerHTML = '<div style="text-align:center;color:var(--gray);">Prezzo non disponibile al momento. Riprova tra poco.</div>';
      return;
    }

    document.getElementById('planBlock').style.display = 'block';
    var featuresHtml = `
        <ul>
          <li>Valutazioni illimitate</li>
          <li>Metodo reddituale se l'immobile è locato</li>
          <li>Narrativa professionale della posizione</li>
          <li>Dati su popolazione, reddito e territorio</li>
          <li>Prossimità servizi (scuole, farmacie, supermercati, stazioni)</li>
          <li>Report senza pubblicità</li>
        </ul>`;
    var annualNote = annual ? `<div class="billing-toggle">
          <label class="billing-option"><input type="radio" name="billing" value="monthly" checked>${fmtEuro(monthly.price)} / mese</label>
          <label class="billing-option"><input type="radio" name="billing" value="annual">${fmtEuro(annual.price)} / anno <span class="save-badge">2 mesi gratis</span></label>
        </div>` : '';
    document.getElementById('planBlock').innerHTML = `
      <div class="plan">
        <h2>Quantum Pro</h2>
        <div class="price" id="planPriceDisplay">${fmtEuro(monthly.price)} <span>/ mese</span></div>
        ${annualNote}
        ${featuresHtml}
        <button onclick="startCheckout(this)">Abbonati ora</button>
        <div class="fineprint">Abbonamento ricorrente, disdicibile in qualsiasi momento. Il rinnovo è automatico finché non lo annulli.</div>
      </div>
    `;

    if(annual){
      document.querySelectorAll('input[name="billing"]').forEach(function(radio){
        radio.addEventListener('change', function(){
          var isAnnual = this.value === 'annual';
          document.getElementById('planPriceDisplay').innerHTML = isAnnual
            ? fmtEuro(annual.price) + " <span>/ anno</span>"
            : fmtEuro(monthly.price) + " <span>/ mese</span>";
        });
      });
    }
  }
  renderPlan();

  async function startCheckout(clickedBtn){
    const { data: { session } } = await sb.auth.getSession();
    if(!session){ window.location.href = 'quantum-create.html'; return; }

    var billingRadio = document.querySelector('input[name="billing"]:checked');
    var billing = billingRadio ? billingRadio.value : 'monthly';

    const originalText = clickedBtn.textContent;
    clickedBtn.disabled = true; clickedBtn.textContent = 'Attendere…';

    try{
      const resp = await fetch(SUPABASE_URL + '/functions/v1/quantum-create-checkout', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + session.access_token
        },
        body: JSON.stringify({ billing: billing })
      });
      const data = await resp.json();
      if(!resp.ok || data.error) throw new Error(data.error || 'Errore avvio pagamento');
      if(data.url){
        window.location.href = data.url; // redirect a Stripe Checkout
      } else {
        throw new Error('URL di pagamento non ricevuto');
      }
    }catch(err){
      showMsg('Errore avvio pagamento: ' + (err.message || err));
      clickedBtn.disabled = false; clickedBtn.textContent = originalText;
    }
  }
</script>
</body>
</html>
