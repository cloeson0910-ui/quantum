<style>

  header{padding:24px;text-align:center;border-bottom:1px solid var(--border);background:#fff;}

</style>

async function extractEdgeFunctionErrorMessage(error){
  try{
    if(error && error.context && typeof error.context.text === "function"){
      var raw = await error.context.text();
      try{ var parsed = JSON.parse(raw); return parsed.error || parsed.message || raw || error.message; }
      catch(e){ return raw || error.message; }
    }
  }catch(e){}
  return (error && error.message) || String(error);
}

// ==== GEOCODIFICA (Nominatim, nessuna chiave richiesta) ====
async function geocodeAddress(address, municipality, province, region){
  var queryParts = [address, municipality, province, region, "Italia"].filter(Boolean);
  if(!queryParts.length) return { lat:null, lng:null };
  var q = queryParts.join(", ");
  try{
    var url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=it&q=" + encodeURIComponent(q);
    var res = await fetch(url, { headers: { "Accept":"application/json" } });
    if(!res.ok) return { lat:null, lng:null };
    var data = await res.json();
    if(!Array.isArray(data) || !data.length) return { lat:null, lng:null };
    return { lat:Number(data[0].lat), lng:Number(data[0].lon) };
  }catch(e){ return { lat:null, lng:null }; }
}

// ==== DATO DI MERCATO PUBBLICO (motore dedicato Immonova, leggero) ====
async function findMarketPricePerSqm(municipality, province, region){
  try{
    var result = await immonovaClient.functions.invoke("immonova-valuation-engine", {
      body: { municipality: municipality || null, province: province || null, region: region || null }
    });
    if(result.error) return { value:null, source:null };
    return result.data || { value:null, source:null };
  }catch(e){ return { value:null, source:null }; }
}

// ==== SOLO PRO: comparabili AI da portali ====
async function findAiComparablesAndNarrative(category, municipality, province, region, internalSize, address, propertyCondition, isRented, currentAnnualRent, hasSeaView, hasHistoricCenter, lat, lng){
  try{
    var result = await immonovaClient.functions.invoke("immonova-ai-valuation-engine", {
      body:{
        category: category||null, municipality: municipality||null, province: province||null, region: region||null,
        internal_size: internalSize||null, address: address||null, property_condition: propertyCondition||null,
        is_rented: !!isRented, current_annual_rent: currentAnnualRent||null,
        has_sea_view: !!hasSeaView, has_historic_center: !!hasHistoricCenter,
        latitude: lat!=null?lat:null, longitude: lng!=null?lng:null
      }
    });
    if(result.error) return { comparables:[], position_analysis:null, positive_elements:[], risk_elements:[], conclusion:null };
    return result.data;
  }catch(e){ return { comparables:[], position_analysis:null, positive_elements:[], risk_elements:[], conclusion:null }; }
}

// ==== SOLO PRO: dati territorio (popolazione/reddito/prossimità) ====
async function findTerritoryData(municipality, province, region){
  try{
    var result = await immonovaClient.functions.invoke("immonova-demographics-engine", {
      body: { municipality: municipality||null, province: province||null, region: region||null }
    });
    if(result.error) return null;
    return result.data;
  }catch(e){ return null; }
}

function weightedExtrasValue(pricePerSqm, garageSqm, gardenSqm){
  if(!pricePerSqm) return 0;
  return (garageSqm ? garageSqm*pricePerSqm*0.35 : 0) + (gardenSqm ? gardenSqm*pricePerSqm*0.15 : 0);
}

function equivalentSurface(internalSize, accessorySize, garageSqm, gardenSqm){
  var total = (internalSize||0)*1.0 + (accessorySize||0)*0.35 + (garageSqm||0)*0.35 + (gardenSqm||0)*0.15;
  return total || null;
}

function trimOutliers(values){
  if(values.length < 3) return values;
  var sorted = values.slice().sort(function(a,b){return a-b;});
  var median = sorted[Math.floor(sorted.length/2)];
  return values.filter(function(v){ return v <= median*2.5 && v >= median*0.4; });
}

// ==== CALCOLO ====
document.getElementById("calculateBtn").addEventListener("click", async function(){
  var municipality = val("municipality");
  if(!municipality){ showMsg("progressMsg","Il comune è obbligatorio.","error"); return; }

  var btn = this; btn.disabled = true;
  showMsg("progressMsg","Calcolo in corso...","info");

  var category = val("category"), province = val("province"), region = val("region"), address = val("address");
  var manualPricePerSqm = numVal("manualPricePerSqm");
  var internalSize = numVal("internalSize"), accessorySize = numVal("accessorySize");
  var garageSqm = numVal("garageSqm"), gardenSqm = numVal("gardenSqm");
  var hasSeaView = document.getElementById("hasSeaView").checked;
  var hasHistoricCenter = document.getElementById("hasHistoricCenter").checked;
  var isRented = document.getElementById("isRented").checked;
  var currentAnnualRent = numVal("currentAnnualRent");
  var propertyCondition = val("propertyCondition");

  try{
    var geo = await geocodeAddress(address, municipality, province, region);
    var marketResult = await findMarketPricePerSqm(municipality, province, region);

    var aiResult = { comparables:[], position_analysis:null, positive_elements:[], risk_elements:[], conclusion:null };
    var territoryData = null;

    // ---- Comparabili AI da portali: ora inclusi anche in Light, dentro lo stesso limite di
    // 4 valutazioni/mese già esistente (costo variabile coperto dalla pubblicità di terzi che
    // compare comunque sul report Light). Territorio/prossimità restano differenziatore Pro. ----
    showMsg("progressMsg","Ricerca comparabili sui portali immobiliari...","info");
    aiResult = await findAiComparablesAndNarrative(category, municipality, province, region, internalSize, address, propertyCondition, isRented, currentAnnualRent, hasSeaView, hasHistoricCenter, geo.lat, geo.lng);

    if(currentTier === "pro"){
      territoryData = await findTerritoryData(municipality, province, region);
    }

    var priceSources = [];
    if(marketResult.value) priceSources.push({ value: marketResult.value, source: marketResult.source || "Dato di mercato pubblico" });
    (aiResult.comparables||[]).forEach(function(c){
      if(c.price_per_sqm) priceSources.push({ value: c.price_per_sqm, source: "Comparabile portale immobiliare" + (c.url ? " (" + c.url + ")" : "") });
    });
    if(manualPricePerSqm){
      // Peso doppio: un dato diretto dell'agenzia sul proprio territorio conta quanto due fonti
      // automatiche, ma resta SEMPRE etichettato come proprio, mai spacciato per dato ufficiale.
      priceSources.push({ value: manualPricePerSqm, source: "Agenzia (dato inserito manualmente)" });
      priceSources.push({ value: manualPricePerSqm, source: "Agenzia (dato inserito manualmente)" });
    }

    if(!priceSources.length){
      showMsg("progressMsg","Nessun dato di mercato disponibile per questa zona (né ufficiale né manuale). Inserisci un prezzo/mq di riferimento nel campo sopra per procedere.","error");
      btn.disabled = false;
      return;
    }

    var pricesPerSqm = priceSources.map(function(p){ return p.value; });
    var cleanPrices = trimOutliers(pricesPerSqm);
    var usedSources = priceSources.filter(function(p){ return cleanPrices.indexOf(p.value) !== -1; })
      .map(function(p){ return p.source; })
      .filter(function(s, i, arr){ return arr.indexOf(s) === i; }); // fonti uniche, senza duplicati

    var avgPricePerSqm = cleanPrices.reduce(function(a,b){return a+b;},0) / cleanPrices.length;
    var minPricePerSqm = Math.min.apply(null, cleanPrices);
    var maxPricePerSqm = Math.max.apply(null, cleanPrices);
    var equivSurface = equivalentSurface(internalSize, accessorySize, garageSqm, gardenSqm);

    var comparativeValue = equivSurface ? (equivSurface * avgPricePerSqm) : null;
    var comparativeMin = equivSurface ? (equivSurface * minPricePerSqm) : null;
    var comparativeMax = equivSurface ? (equivSurface * maxPricePerSqm) : null;
    var extrasValue = weightedExtrasValue(avgPricePerSqm, garageSqm, gardenSqm);

    var incomeValue = null;
    if(currentTier === "pro" && isRented && currentAnnualRent){
      var capRate = 0.06;
      incomeValue = currentAnnualRent / capRate;
    }

    var finalValue = comparativeValue;
    if(incomeValue){
      finalValue = (comparativeValue * 0.6) + (incomeValue * 0.4);
    }
    if(finalValue) finalValue += extrasValue;

    var calculationResult = {
      tier: currentTier,
      geocode: geo,
      market_price_per_sqm: marketResult.value,
      market_source: marketResult.source || null,
      ai_comparables: aiResult.comparables || [],
      position_analysis: aiResult.position_analysis || null,
      positive_elements: aiResult.positive_elements || [],
      risk_elements: aiResult.risk_elements || [],
      conclusion: aiResult.conclusion || null,
      territory_data: territoryData,
      equivalent_surface: equivSurface,
      avg_price_per_sqm: avgPricePerSqm,
      price_sources_used: usedSources,
      comparative_value: comparativeValue,
      comparative_min: comparativeMin,
      comparative_max: comparativeMax,
      income_value: incomeValue,
      final_value: finalValue,
      calculated_at: new Date().toISOString()
    };

    var propertyData = {
      category: category, address: address, municipality: municipality, postal_code: val("postalCode"), province: province, region: region,
      internal_size: internalSize, accessory_size: accessorySize, garage_sqm: garageSqm, garden_sqm: gardenSqm,
      has_sea_view: hasSeaView, has_historic_center: hasHistoricCenter, is_rented: isRented,
      current_annual_rent: currentAnnualRent, property_condition: propertyCondition
    };

    var sellerData = { name: val("sellerName"), contact: val("sellerContact") };

    showMsg("progressMsg","Salvataggio...","info");
    var insertResult = await client.from("quantum_valuations").insert({
      client_id: currentUser.id, tier: currentTier, property_data: propertyData, seller_data: sellerData,
      calculation_result: calculationResult, status: "completed"
    }).select("id").single();

    if(insertResult.error){
      showMsg("progressMsg", "Errore salvataggio: " + (await extractEdgeFunctionErrorMessage(insertResult.error)), "error");
      btn.disabled = false;
      return;
    }

    window.location.href = "quantum-view.html?id=" + insertResult.data.id;

  }catch(e){
    showMsg("progressMsg", "Errore imprevisto: " + e.message, "error");
    btn.disabled = false;
  }
});

client.auth.onAuthStateChange(function(event, session){
  if(session) onAuthReady();
});
onAuthReady();
</script>
